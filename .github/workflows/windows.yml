name: Build for Windows

on:
  push:
    branches-ignore:
      - 'gh-pages'

env:
  postgis_version: 3

jobs:
  build:
    name: Build
    runs-on: windows-latest

    strategy:
      matrix:
        pg_major: [12.8, 13.4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install boost
        uses: MarkusJx/install-boost@v1.0.1
        id: install-boost
        with:
          # REQUIRED: Specify the required boost version
          # A list of supported versions can be found here:
          # https://github.com/actions/boost-versions/blob/main/versions-manifest.json
          boost_version: 1.73.0

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.0.3

      - name: Install PostgreSQL
        run: |
          curl https://get.enterprisedb.com/postgresql/postgresql-${{ matrix.pg_major }}-1-windows-x64-binaries.zip --output pgsql.zip
          Expand-Archive 'pgsql.zip' -Force
          $env:path += ";$(Get-Location)\pgsql\pgsql\bin\"
          $env:path -split ";"
          initdb -D pgsql\data -U postgres
          pg_ctl -D pgsql\data start
          echo "POSTGRESQL_DIR=$pwd\pgsql\pgsql" >> $env:GITHUB_ENV

      - name: Check Postgres running
        run: |
          ${{ env.POSTGRESQL_DIR }}\bin\psql -U postgres -d postgres -c "SELECT version()"

      - name: Build VROOM v1.10.0
        run: |
          curl -L https://github.com/VROOM-Project/vroom/archive/refs/tags/v1.10.0.zip --output v1.10.0.zip
          Expand-Archive 'v1.10.0.zip' -Force
          
          curl -L https://sourceforge.net/projects/asio/files/asio/1.18.2%20%28Stable%29/asio-1.18.2.zip/download --output asio.zip
          Expand-Archive 'asio.zip' -Force
          
          curl -L http://downloads.sourceforge.net/gnuwin32/openssl-0.9.8h-1-lib.zip --output openssl.zip
          Expand-Archive 'openssl.zip' -Force
          
          ls .\v1.10.0
          cd .\v1.10.0\vroom-1.10.0\src
          
          (Get-Content makefile -Raw) -creplace 'CXXFLAGS = ', 'CXXFLAGS = -I../include -I../../../asio/asio-1.18.2/include -I../../../openssl/include -DNOGDI ' | Set-Content "makefile"
          
          # Create object file with position independent code using -fPIC flag
          # sed -i 's/CXXFLAGS = /CXXFLAGS = -fPIC /' makefile

          make
          cd ..
          echo "VROOM_INSTALL_PATH=$pwd" >> $env:GITHUB_ENV

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -DPOSTGRESQL_BIN=${{ env.POSTGRESQL_DIR }}\bin -DPOSTGRESQL_INCLUDE_DIR="${{ env.POSTGRESQL_DIR }}\include;${{ env.POSTGRESQL_DIR }}\include\server" -G"Visual Studio 16 2019" -DCMAKE_BUILD_TYPE=Release -DWITH_DOC=OFF ..
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}

      - name: build
        run: |
          cd build
          msbuild PGROUTING.sln /target:Build /property:Configuration=Release
